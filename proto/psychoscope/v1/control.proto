syntax = "proto3";

package psychoscope.v1;

import "google/protobuf/timestamp.proto";
import "psychoscope/v1/ipc.proto";

option go_package = "github.com/psychoscope-io/psychoscope-proto/gen/go/psychoscope/v1;psychoscopev1";

// Canal de controle CLI <-> Core (ctl.sock). Mesmo framing do ipc.proto:
//   [ uint32 big-endian: N ][ N bytes: RequisicaoControle | RespostaControle ]
// O cliente envia RequisicaoControle; o Core responde com RespostaControle
// (uma por requisicao, exceto AssinarAlertas, que gera um stream de respostas
// com o mesmo id_requisicao_referencia ate a conexao ser encerrada).

message RequisicaoControle {
  string id_requisicao = 1;

  oneof pedido {
    PedidoListarModulos listar_modulos = 2;
    PedidoEnviarComando enviar_comando = 3;
    PedidoAssinarAlertas assinar_alertas = 4;
    PedidoListarAlertas listar_alertas = 5;
    PedidoMetricas metricas = 6;
    PedidoLerConfig ler_config = 7;
    PedidoAplicarConfig aplicar_config = 8;
  }
}

message PedidoListarModulos {}

message PedidoEnviarComando {
  string id_modulo = 1;
  ComandoControle.TipoAcao acao = 2;
  map<string, string> parametros = 3;
}

message PedidoAssinarAlertas {
  // Reenvia os alertas recentes (historico em memoria do Core) antes do stream ao vivo.
  bool incluir_historico = 1;
}

// Consulta o historico persistido de alertas (mais novo primeiro).
message PedidoListarAlertas {
  // Maximo de alertas devolvidos; 0 = padrao do Core (100). O Core limita a 1000.
  uint32 limite = 1;
  // So alertas gerados a partir deste instante (ausente = sem limite inferior).
  google.protobuf.Timestamp desde = 2;
  // So alertas com severidade >= esta (DESCONHECIDA = sem filtro).
  Severidade severidade_minima = 3;
  // So alertas desta regra (vazio = todas).
  string regra = 4;
  // So alertas originados deste modulo (vazio = todos).
  string id_modulo = 5;
}

// Instantaneo das metricas do Core (motor de deteccao, armazenamento, modulos).
message PedidoMetricas {}

// Le a configuracao editavel pelo canal de controle (limiares, excecoes e regras
// desligadas), com valor atual, padrao e origem de cada campo. Qualquer UID permitido.
message PedidoLerConfig {}

// Aplica ajustes de configuracao. So o root (UID verificado por SO_PEERCRED) pode escrever;
// os demais recebem erro e nada e gravado. Os ajustes sao validados em conjunto: ou todos
// valem, ou nenhum. A resposta traz a configuracao ja atualizada (ListaConfig).
message PedidoAplicarConfig {
  // caminho do campo -> valor em JSON, o mesmo formato do arquivo de configuracao
  // (duracoes como texto: "10s"; listas como arrays JSON).
  map<string, string> ajustes = 1;
  // Caminhos a restaurar ao valor base (o do arquivo do administrador, ou o padrao).
  repeated string restaurar = 2;
}

message RespostaControle {
  string id_requisicao_referencia = 1;
  bool sucesso = 2;
  string mensagem_erro = 3;

  oneof resultado {
    ListaModulos modulos = 4;
    Alerta alerta = 5;
    ListaAlertas alertas = 6;
    ListaMetricas metricas = 7;
    ListaConfig config = 8;
  }
}

enum EstadoModulo {
  ESTADO_DESCONHECIDO = 0;
  ESTADO_INICIANDO = 1;
  ESTADO_CONECTADO = 2;
  ESTADO_PAUSADO = 3;
  ESTADO_REINICIANDO = 4;
  ESTADO_FALHOU = 5;
  ESTADO_ENCERRADO = 6;
}

message ModuloInfo {
  string id_modulo = 1;
  EstadoModulo estado = 2;
  uint32 pid = 3;
  uint32 reinicios = 4;
  google.protobuf.Timestamp ultimo_contato = 5;
  StatusModulo ultimo_status = 6;
  string ultimo_erro = 7;
}

message ListaModulos {
  repeated ModuloInfo modulos = 1;
}

enum Severidade {
  SEVERIDADE_DESCONHECIDA = 0;
  SEVERIDADE_BAIXA = 1;
  SEVERIDADE_MEDIA = 2;
  SEVERIDADE_ALTA = 3;
  SEVERIDADE_CRITICA = 4;
}

message Alerta {
  string id_alerta = 1;
  string regra = 2;
  Severidade severidade = 3;
  string descricao = 4;
  google.protobuf.Timestamp timestamp = 5;
  string id_modulo_origem = 6;
  map<string, string> contexto = 7;
}

message ListaAlertas {
  repeated Alerta alertas = 1;
  // Total de alertas que casam com o filtro, ignorando o limite.
  uint64 total = 2;
}

enum TipoMetrica {
  TIPO_METRICA_DESCONHECIDO = 0;
  // Valor que so cresce (reinicia com o processo).
  TIPO_METRICA_CONTADOR = 1;
  // Valor instantaneo que sobe e desce.
  TIPO_METRICA_MEDIDOR = 2;
}

// Metrica generica: novas metricas nao exigem mudanca no contrato.
message Metrica {
  // Nome no estilo Prometheus, ex.: psychoscope_engine_events_processed_total.
  string nome = 1;
  TipoMetrica tipo = 2;
  string ajuda = 3;
  map<string, string> rotulos = 4;
  double valor = 5;
}

message ListaMetricas {
  repeated Metrica metricas = 1;
}

enum TipoCampo {
  TIPO_CAMPO_DESCONHECIDO = 0;
  TIPO_CAMPO_INTEIRO = 1;
  TIPO_CAMPO_DECIMAL = 2;
  // Duracao como texto JSON, ex.: "30s", "2m".
  TIPO_CAMPO_DURACAO = 3;
  TIPO_CAMPO_LISTA_TEXTO = 4;
  TIPO_CAMPO_LISTA_INTEIRO = 5;
}

enum OrigemCampo {
  ORIGEM_CAMPO_DESCONHECIDA = 0;
  // Valor padrao do Core.
  ORIGEM_CAMPO_PADRAO = 1;
  // Definido no arquivo do administrador.
  ORIGEM_CAMPO_ARQUIVO = 2;
  // Definido por um ajuste (PedidoAplicarConfig).
  ORIGEM_CAMPO_AJUSTE = 3;
}

// Um campo de configuracao editavel pelo canal de controle.
message CampoConfig {
  // Caminho com pontos, o mesmo do arquivo de configuracao: detection.beacon.ignore_ports.
  string caminho = 1;
  TipoCampo tipo = 2;
  // Valores em JSON.
  string valor_atual = 3;
  string valor_padrao = 4;
  OrigemCampo origem = 5;
  string descricao = 6;
  // Nome para exibir ao usuario (ex.: "Destinos ignorados"). Vazio: usar o caminho.
  string rotulo = 7;
}

message ListaConfig {
  repeated CampoConfig campos = 1;
  // O cliente nao pode escrever (nao e root): a tela deve ficar em modo leitura.
  bool somente_leitura = 2;
  // Arquivo onde os ajustes ficam gravados.
  string arquivo_ajustes = 3;
  // Avisos nao fatais da ultima aplicacao (ex.: gravado, mas a aplicacao ao vivo expirou).
  repeated string avisos = 4;
}
