name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: mensagens de commit (Conventional Commits)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF..HEAD"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="HEAD~1..HEAD"
          else
            range="$BEFORE..$SHA"
          fi
          ./scripts/check-commits.sh "$range"
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - name: shellcheck e actionlint
        run: |
          git ls-files -z '*.sh' '.githooks/*' | xargs -0 shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 && "$(go env GOPATH)/bin/actionlint"
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          pr_comment: false # PRs do Dependabot tem token somente leitura: comentar falharia e mascararia o erro real
          breaking: ${{ github.event_name == 'pull_request' }}
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - run: buf generate && git diff --exit-code gen/
      - run: go build ./...
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cd rust && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo build
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { manifest-path: rust/Cargo.toml }
